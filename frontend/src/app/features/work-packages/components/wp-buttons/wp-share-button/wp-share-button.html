@if (showShareButton) {
<button
  class="button toolbar-icon"
  data-test-selector="op-wp-share-button"
  [title]="text.share"
  (click)="openModal()"
  >
  <svg
    share-android-icon
    class="button--icon"
    size="small"
  ></svg>
  @if ((shareCount$ | async); as shareCount) {
    <span class="button--text">
      <span class="badge"
      [textContent]="shareCount"></span>
    </span>
  }

</button>
}
