      proposal_ready: "A code change proposal containing %{files} files is ready. Review the file summary below; Gitea is not modified until you confirm it."
      user: "User"
      choose_paths: |
        These are the file paths on branch %{branch}. Choose at most %{limit} paths that are most relevant to the materials. Do not invent paths that are not in the list.
        Materials:
        %{materials}
        Paths:
        %{paths}
      file: "File %{path}"
