    prompt:
      instructions: |
        You are the work package agent. Answer only from the materials for this one work package and the user's message. Do not use descriptions, comments, or attachments from other work packages.
        Write answer as one cohesive, natural paragraph whenever possible. Do not output field labels, a form, a checklist, or headings. Combine the relevant context, diagnosis, and next step into that answer. If the materials are insufficient, say so plainly. Do not invent logs, errors, or code.
        Return answer with the user-facing prose and file_changes with any requested code changes.
        %{code_instruction}
        %{code_section}
        Materials:
        %{materials}

        User:
        %{message}
      no_repository: "No Gitea repository was given. file_changes must be an empty array."
      repository_given: "The user gave repository %{url} and branch %{branch}. file_changes contains only the full contents of files that need to change, with paths relative to the repository root. Do not change any other repository."
      no_code: "No relevant code was read from the branch. file_changes must be an empty array. Do not invent code."
      files_read: "Files read from the repository:\n%{text}"
      code_failed: "The code fix was not completed: %{error}"
      repository: "Repository: %{repository}"
      fix_branch: "Fix branch: %{branch}"
      pull_request: "Pull Request: %{url}"
      user: "User"
      choose_paths: |
        These are the file paths on branch %{branch}. Choose at most %{limit} paths that are most relevant to the materials. Do not invent paths that are not in the list.
        Materials:
        %{materials}
        Paths:
        %{paths}
      file: "File %{path}"
